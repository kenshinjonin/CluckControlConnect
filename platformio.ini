; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Librairies utilisées :
; - NTPClient
; - RTClib
; - Dusk2Dawn
; - ElegantOTA
; - PubSubClient

[env:az-delivery-devkit-v4]
; Version figée : arduino-esp32 3.x (ESP-IDF 5) modifie la signature de
; esp_task_wdt_init(), le firmware ne compilerait plus sur une plateforme plus
; récente resolue automatiquement.
platform = espressif32@6.10.0
framework = arduino
board = az-delivery-devkit-v4
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=0
build_unflags = 
    -DCORE_DEBUG_LEVEL=5
lib_deps = 
    arduino-libraries/NTPClient@^3.2.1
    adafruit/RTClib@^2.1.3
    ayushsharma82/ElegantOTA@^3.1.0
    knolleary/PubSubClient@^2.8
lib_extra_dirs =
    lib/